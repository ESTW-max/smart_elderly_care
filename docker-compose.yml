services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: miniapp
      POSTGRES_USER: miniapp
      POSTGRES_PASSWORD: miniapp-dev-only
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U miniapp -d miniapp"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./apps/api
    restart: unless-stopped
    environment:
      APP_NAME: MiniApp API
      ENVIRONMENT: development
      DATABASE_URL: postgresql+asyncpg://miniapp:miniapp-dev-only@postgres:5432/miniapp
      CORS_ORIGINS: http://localhost:5173,http://localhost:5174,http://127.0.0.1:5173,http://127.0.0.1:5174
      JWT_SECRET: change-me-before-production
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
