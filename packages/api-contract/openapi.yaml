openapi: 3.1.0
info:
  title: MiniApp API
  version: 0.1.0
  description: API contract shared by the UniApp client and FastAPI service.
servers:
  - url: http://127.0.0.1:8000/api/v1
    description: Local development
paths:
  /health:
    get:
      operationId: getHealth
      summary: Check API health
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /items:
    get:
      operationId: listItems
      summary: List items
      responses:
        "200":
          description: Items ordered from newest to oldest
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ItemRead"
    post:
      operationId: createItem
      summary: Create an item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ItemCreate"
      responses:
        "201":
          description: Item created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemRead"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
  /agent/approvals:
    get:
      operationId: listAgentApprovals
      summary: List pending Agent approvals
      security:
        - AgentToken: []
      responses:
        "200":
          description: Pending approvals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AgentApprovalRead"
        "401":
          $ref: "#/components/responses/AgentUnauthorized"
        "404":
          $ref: "#/components/responses/AgentDisabled"
        "503":
          $ref: "#/components/responses/AgentUnavailable"
  /agent/approvals/{approval_id}/decision:
    post:
      operationId: decideAgentApproval
      summary: Approve or deny an Agent action
      security:
        - AgentToken: []
      parameters:
        - name: approval_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentApprovalDecision"
      responses:
        "200":
          description: Decision recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentApprovalRead"
        "401":
          $ref: "#/components/responses/AgentUnauthorized"
        "404":
          description: Pending approval not found
        "503":
          $ref: "#/components/responses/AgentUnavailable"
  /agent/tasks/{task_id}:
    get:
      operationId: getAgentTask
      summary: Get a persisted Agent task
      security:
        - AgentToken: []
      parameters:
        - name: task_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Persisted task snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentTestResponse"
        "401":
          $ref: "#/components/responses/AgentUnauthorized"
        "404":
          description: Agent task not found
        "503":
          $ref: "#/components/responses/AgentUnavailable"
  /agent/tasks/{task_id}/resume:
    post:
      operationId: resumeAgentTask
      summary: Resume a persisted Agent task
      security:
        - AgentToken: []
      parameters:
        - name: task_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Agent execution summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentTestResponse"
        "401":
          $ref: "#/components/responses/AgentUnauthorized"
        "404":
          description: Agent task not found
        "409":
          description: Task is not resumable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDetail"
        "503":
          $ref: "#/components/responses/AgentUnavailable"
  /agent/test:
    post:
      operationId: testAgent
      summary: Run a one-off Agent capability test
      security:
        - AgentToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentTestRequest"
      responses:
        "200":
          description: Agent execution summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentTestResponse"
        "401":
          $ref: "#/components/responses/AgentUnauthorized"
        "404":
          $ref: "#/components/responses/AgentDisabled"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
        "503":
          $ref: "#/components/responses/AgentUnavailable"
  /items/{item_id}:
    parameters:
      - name: item_id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
    put:
      operationId: updateItem
      summary: Update an item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ItemUpdate"
      responses:
        "200":
          description: Item updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemRead"
        "404":
          description: Item not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDetail"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
    delete:
      operationId: deleteItem
      summary: Delete an item
      responses:
        "204":
          description: Item deleted
        "404":
          description: Item not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDetail"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
components:
  securitySchemes:
    AgentToken:
      type: apiKey
      in: header
      name: X-Agent-Token
      description: >
        Shared secret from AGENT_API_TOKEN, formatted as name:token pairs.
        The matched name is recorded as the actor on approvals and audit
        events. Every /agent/* endpoint requires it; the API returns 503
        while no token is configured rather than serving unauthenticated.
  responses:
    AgentUnauthorized:
      description: Missing or invalid X-Agent-Token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorDetail"
    AgentDisabled:
      description: Agent endpoints are disabled
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorDetail"
    AgentUnavailable:
      description: AGENT_API_TOKEN is not configured
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorDetail"
  schemas:
    AgentApprovalDecision:
      type: object
      additionalProperties: false
      required: [approved]
      properties:
        approved:
          type: boolean
    AgentApprovalRead:
      type: object
      required: [id, tool_name, arguments, status, created_at]
      properties:
        id:
          type: string
        tool_name:
          type: string
        arguments:
          type: object
        status:
          type: string
        created_at:
          type: string
        decided_at:
          anyOf:
            - type: string
            - type: "null"
        decided_by:
          anyOf:
            - type: string
            - type: "null"
          description: Actor name of the API token that recorded the decision
    AgentTestRequest:
      type: object
      additionalProperties: false
      required: [goal]
      properties:
        goal:
          type: string
          minLength: 1
          description: 自然语言任务目标
    AgentToolObservation:
      type: object
      required: [call_id, success, result, error]
      properties:
        call_id:
          type: string
        success:
          type: boolean
        result: {}
        error:
          anyOf:
            - type: string
            - type: "null"
    AgentStepRead:
      type: object
      required: [id, tool_calls, observations, content, tokens_used]
      properties:
        id:
          type: string
        tool_calls:
          type: array
          items:
            type: string
        observations:
          type: array
          items:
            $ref: "#/components/schemas/AgentToolObservation"
        content:
          type: string
        tokens_used:
          type: integer
    AgentTurnRead:
      type: object
      required: [id, steps]
      properties:
        id:
          type: string
        steps:
          type: array
          items:
            $ref: "#/components/schemas/AgentStepRead"
    AgentTestResponse:
      type: object
      required: [task_id, status, goal, model, turns, total_tokens]
      properties:
        task_id:
          type: string
        status:
          type: string
        goal:
          type: string
        model:
          type: string
        turns:
          type: array
          items:
            $ref: "#/components/schemas/AgentTurnRead"
        total_tokens:
          type: integer
        error:
          anyOf:
            - type: string
            - type: "null"
    ErrorDetail:
      type: object
      required: [detail]
      properties:
        detail:
          type: string
    HealthResponse:
      type: object
      required: [status, service]
      properties:
        status:
          type: string
          example: ok
        service:
          type: string
          example: MiniApp API
    ValidationError:
      type: object
      required: [loc, msg, type]
      properties:
        loc:
          type: array
          items:
            anyOf:
              - type: string
              - type: integer
        msg:
          type: string
        type:
          type: string
    HTTPValidationError:
      type: object
      properties:
        detail:
          type: array
          items:
            $ref: "#/components/schemas/ValidationError"
    ItemCreate:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 80
          pattern: ".*\\S.*"
    ItemUpdate:
      type: object
      additionalProperties: false
      required: [completed]
      properties:
        completed:
          type: boolean
    ItemRead:
      type: object
      required: [id, title, completed, created_at]
      properties:
        id:
          type: integer
        title:
          type: string
        completed:
          type: boolean
        created_at:
          type: string
          format: date-time
